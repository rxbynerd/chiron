# A ResearchConfig for the in-process research worker (--agent worker).
# Use as a base for a pipeline or with --config:
#
#   export MODEL_KEY=... SEARCH_KEY=...
#   export CHIRON_FLEET_MODEL_ENDPOINT=https://api.openai.com/v1
#   export CHIRON_FLEET_SEARCH_ENDPOINT=https://search.example.com/mcp
#   chiron research --config examples/researchconfig/worker.yaml \
#     --query "Competitive landscape of 10BASE-T1L PHY vendors"
#
# Keys mirror internal/config.ResearchConfig. The Gemini-only levers
# (budget, plan, accept_plan, model, visualise, tools, mcp, file_search,
# inputs) are rejected for this agent; spend is bounded by the fleet
# block instead. template is honoured: it replaces the worker's output
# format block.
#
# The endpoints the keys are sent to never come from a config file: a
# base config naming model_endpoint, search_endpoint, knowledge_endpoint or
# exa_endpoint is refused. Supply each with its flag (--fleet-model-endpoint,
# --fleet-search-endpoint, --fleet-knowledge-endpoint, --fleet-exa-endpoint)
# or environment variable (CHIRON_FLEET_MODEL_ENDPOINT,
# CHIRON_FLEET_SEARCH_ENDPOINT, CHIRON_FLEET_KNOWLEDGE_ENDPOINT,
# CHIRON_FLEET_EXA_ENDPOINT); a set flag wins. Endpoints must be absolute
# https:// (http:// for loopback only).
agent: worker
output: text
timeout: 30m
fleet:
  model_name: gpt-5.5
  model_key_ref: secret://MODEL_KEY
  search_key_ref: secret://SEARCH_KEY
  # search_tool and search_query_arg default to the reference backend's
  # search/query; set them only for a vendor search server that names its
  # tool or query argument differently.
  # search_tool: web_search
  # search_query_arg: q
  # Exa can search and fetch instead (README, "Searching and fetching
  # through Exa"). Uncomment, drop search_key_ref above, and supply the
  # endpoint with --fleet-exa-endpoint or CHIRON_FLEET_EXA_ENDPOINT
  # (https://api.exa.ai). Queries and fetched URLs then go to Exa.
  # search_provider: exa              # or mcp (default)
  # fetch_provider: exa               # or direct (default)
  # exa_key_ref: secret://EXA_KEY     # one key for both roles
  # Sending the research question with each search is per run only:
  # pass --fleet-search-send-objective; a config file cannot set it.
  max_turns: 8
  max_tokens: 400000
  worker_timeout: 5m
  max_page_bytes: 65536
  # ceiling_gbp is honoured only with a price set (GBP per million prompt /
  # completion tokens); a ceiling with both prices at 0 is rejected.
  price_input_gbp_per_mtok: 1.5
  price_output_gbp_per_mtok: 12
  ceiling_gbp: 2.5
  # Organisational knowledge (docs/KNOWLEDGE.md). Uncomment to let the
  # worker recall from a knowledge store, and supply its endpoint with
  # --fleet-knowledge-endpoint or CHIRON_FLEET_KNOWLEDGE_ENDPOINT; its key
  # (if any) travels to that endpoint.
  # knowledge_provider: billet        # or alexandria
  # knowledge_key_ref: secret://KNOWLEDGE_KEY   # required for alexandria
  # knowledge_space: team-notes       # alexandria only: space slug
  # knowledge_limit: 5                # hits per recall, 1..20
  # knowledge_remember: true          # billet only: save completed findings

# A ResearchConfig for the in-process research worker (--agent worker).
# Use as a base for a pipeline or with --config:
#
#   export MODEL_KEY=... SEARCH_KEY=...
#   chiron research --config examples/researchconfig/worker.yaml \
#     --query "Competitive landscape of 10BASE-T1L PHY vendors"
#
# Keys mirror internal/config.ResearchConfig. The Gemini-only levers
# (budget, plan, model, visualise, tools, mcp, file_search, inputs,
# template) are rejected for this agent; spend is bounded by the fleet
# block instead. Endpoints must be absolute https:// (http:// for
# loopback only) because the keys travel to whatever they name.
agent: worker
output: text
timeout: 30m
fleet:
  model_endpoint: https://api.openai.com/v1
  model_name: gpt-5.5
  model_key_ref: secret://MODEL_KEY
  search_endpoint: https://search.example.com/mcp
  search_key_ref: secret://SEARCH_KEY
  max_turns: 8
  max_tokens: 400000
  worker_timeout: 5m
  max_page_bytes: 65536
  # gpt-5.5 is in the built-in price table (README.md, "Model prices"), so
  # ceiling_gbp works without price_input_gbp_per_mtok/price_output_gbp_per_mtok
  # set below. Uncomment either to override the table for this model.
  # price_input_gbp_per_mtok: 1.5
  # price_output_gbp_per_mtok: 12
  ceiling_gbp: 2.5
  # Organisational knowledge (docs/KNOWLEDGE.md). Uncomment to let the
  # worker recall from a knowledge store; the endpoint follows the same
  # scheme rule, and its key (if any) travels to it.
  # knowledge_provider: billet        # or alexandria
  # knowledge_endpoint: http://127.0.0.1:8140/
  # knowledge_key_ref: secret://KNOWLEDGE_KEY   # required for alexandria
  # knowledge_space: team-notes       # alexandria only: space slug
  # knowledge_limit: 5                # hits per recall, 1..20
  # knowledge_remember: true          # billet only: save completed findings
